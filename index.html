<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Enter your PIN to unlock the Pomodoro suite." />
  <title>Pomodoro — Unlock</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="lock" data-mode="focus">
  <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

  <div class="lock-wrap">
    <div class="lock-card">
      <div class="lock-brand">
        <span class="brand-mark" aria-hidden="true">🍅</span>
        <span class="brand-name">Pomodoro Suite</span>
      </div>
      <h1 class="lock-title">Enter your PIN</h1>

      <div class="pin-dots" id="pinDots" aria-label="PIN entry">
        <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
        <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
        <span class="pdot"></span><span class="pdot"></span>
      </div>
      <p class="lock-err" id="lockErr" role="alert"></p>

      <div class="keypad" aria-label="PIN keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key key-fn" data-key="back" aria-label="Delete digit">⌫</button>
        <button class="key" data-key="0">0</button>
        <button class="key key-go" data-key="go" aria-label="Enter">✓</button>
      </div>

      <div class="lock-hints">
        <span class="hint"><kbd>123</kbd> Timer</span>
        <span class="hint"><kbd>1234</kbd> Calendar</span>
        <span class="hint"><kbd>12345</kbd> Notes</span>
      </div>
    </div>
    <p class="lock-foot">Type on your keyboard or tap the keypad · <kbd>Enter</kbd> to submit</p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
